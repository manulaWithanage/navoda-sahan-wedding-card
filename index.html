<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navoda & Sahan - Wedding Invitation</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Wedding Invitation of Navoda & Sahan.">
  <meta name="author" content="Navoda & Sahan">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Floating Golden Border -->
  <div class="viewport-border" aria-hidden="true"></div>

  <!-- Main Card Container -->
  <div class="card-wrapper">
    <!-- Hero Section -->
    <section id="hero" class="hero-section">
      <div class="hero-content">
        <p class="subtitle fade-in">TOGETHER WITH THEIR FAMILIES</p>
        
        <div class="divider fade-in" aria-hidden="true">
          <span class="line"></span>
          <span class="diamond">♦</span>
          <span class="line"></span>
        </div>

        <h1 class="couple-names fade-in">
          <span class="name">Navoda</span>
          <span class="ampersand">&</span>
          <span class="name">Sahan</span>
        </h1>

        <div class="divider fade-in" aria-hidden="true">
          <span class="line"></span>
          <span class="diamond">♦</span>
          <span class="line"></span>
        </div>

        <p class="invite-text fade-in">
          Request the honour of your presence<br>
          at the celebration of their marriage
        </p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
